version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  # Rails 8.1 uses the pre-3.0 JSON options API. Revisit with a Rails upgrade.
  ignore:
  - dependency-name: json
    update-types: ["version-update:semver-major"]
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
